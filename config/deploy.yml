# Name of your application. Used to uniquely configure containers.
service: tcc_cesep1

# Name of the container image (use your-user/app-name on external registries).
image: cesep/tcc_cesep1

# Tempo máximo para o app ficar saudável no deploy. Na 1ª vez o db:prepare cria os 4 bancos
# e roda as migrações antes de iniciar, o que passa dos 30s padrão.
deploy_timeout: 120

# Deploy to these servers.
servers:
  web:
    - 18.231.22.133   # IP estático do Lightsail (tcc-api)
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
proxy:
  ssl: true
  host: api.cesepfaccat.com.br   # domínio público da API (HTTPS automático via Let's Encrypt)

# Where you keep your container images.
registry:
  # Docker Hub é o padrão quando 'server' é omitido. Crie um repositório PRIVADO 'tcc_cesep1'.
  username: cesep
  # A senha é um Access Token do Docker Hub, lido de .kamal/secrets (nunca em texto puro aqui).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - TCC_CESEP1_DATABASE_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - SMTP_USER_NAME
    - SMTP_PASSWORD
  clear:
    # Roda o supervisor do Solid Queue dentro do Puma (servidor único).
    SOLID_QUEUE_IN_PUMA: true

    # Banco PostgreSQL roda como acessório no MESMO servidor (ver 'accessories.db' abaixo).
    # 'tcc_cesep1-db' é o nome do container do banco na rede interna do Kamal (não precisa trocar).
    DB_HOST: tcc_cesep1-db

    # Domínio público da API (host authorization). TROQUE.
    APP_HOST: api.cesepfaccat.com.br

    # URL do front-end (subdomínio no Amplify). DEVE ser UMA única URL (entra no link dos e-mails). TROQUE.
    FRONTEND_URL: https://app.cesepfaccat.com.br

    # Domínio-pai comum ao front (app.*) e à API (api.*). Sem ele o cookie
    # XSRF-TOKEN fica preso à API e o front não consegue lê-lo para ecoar o
    # header X-XSRF-TOKEN — todo POST/PUT/DELETE volta 403. TROQUE junto com os
    # domínios acima (sem "app."/"api." na frente).
    COOKIE_DOMAIN: cesepfaccat.com.br

    # Remetente dos e-mails (precisa pertencer ao domínio verificado no SES). TROQUE.
    DEVISE_MAILER_SENDER: noreply@cesepfaccat.com.br

    # Armazenamento de arquivos no Amazon S3.
    AWS_REGION: sa-east-1
    AWS_S3_BUCKET: tcc-cesep1-storage-prod   # TROQUE se usou outro nome de bucket

    # Servidor SMTP do Brevo (porta 587).
    SMTP_ADDRESS: smtp-relay.brevo.com

    # Para ver tudo nos logs, troque para: debug
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Sem volumes persistentes: os arquivos vão para o Amazon S3 e o banco é gerenciado (Lightsail/RDS).
# Se um dia voltar a usar armazenamento local, reative a linha abaixo.
# volumes:
#   - "tcc_cesep1_storage:/rails/storage"


# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.4.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# O Lightsail Ubuntu loga como 'ubuntu' (adicionado ao grupo docker na Parte 2.10).
ssh:
  user: ubuntu

# Banco de dados PostgreSQL rodando como acessório no MESMO servidor (mais barato que banco gerenciado).
# Os dados ficam num diretório no disco do servidor (persistem entre deploys) e há backup diário
# automático para o S3 (ver app/jobs/database_backup_job.rb + config/recurring.yml).
accessories:
  db:
    image: postgres:15
    host: 18.231.22.133   # MESMO IP estático do Lightsail (igual ao de 'servers.web')
    # Publica a porta apenas em localhost (o app acessa pela rede interna do Kamal, não pela internet).
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: tcc_cesep1
        POSTGRES_DB: tcc_cesep1_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
